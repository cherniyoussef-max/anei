<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="avs-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="avs-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="144" height="144" rx="20" fill="url(#avs-bg)"/>
  <rect x="8.5" y="8.5" width="143" height="143" rx="19.5" stroke="#E2E8F0"/>

  <!-- Shield Check Emblem Badge (Top Right) -->
  <g transform="translate(108, 22)">
    <circle cx="16" cy="16" r="16" fill="#0A192F"/>
    <path d="M16 7L24 10.5V16C24 21 20.5 24.5 16 26C11.5 24.5 8 21 8 16V10.5L16 7Z" fill="#C9913F"/>
    <path d="M13 16L15.5 18.5L20 14" stroke="#0A192F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Desk Line -->
  <line x1="22" y1="126" x2="138" y2="126" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AVS Assistant Figure (Left-Center) -->
  <g id="avs-figure">
    <!-- Torso -->
    <path d="M38 126V106C38 98 44 92 52 90L58 89V82H68V89L74 90C82 92 88 98 88 106V126" fill="#0A192F"/>
    <!-- Guiding arm extending across to student/tablet -->
    <path d="M74 96L92 108" stroke="#0A192F" stroke-width="6" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="63" cy="66" r="13" fill="#0A192F"/>
    <path d="M50 65C50 54 56 50 64 50C72 50 76 54 76 65C72 62 67 61 63 61C57 61 53 63 50 65Z" fill="#0056D2"/>
    <!-- ID / Accreditation Badge on neck -->
    <line x1="63" y1="82" x2="63" y2="92" stroke="#C9913F" stroke-width="1.2"/>
    <rect x="60" y="92" width="6" height="8" rx="1" fill="#FFFFFF" stroke="#0A192F" stroke-width="0.8"/>
  </g>

  <!-- Student Figure (Right-Center) -->
  <g id="student-figure">
    <!-- Torso -->
    <path d="M86 126V114C86 107 90 103 97 101L101 100V94H109V100L113 101C120 103 124 107 124 114V126" fill="#0056D2"/>
    <!-- Head & Hair -->
    <circle cx="105" cy="78" r="10" fill="#0A192F"/>
    <path d="M96 77C96 70 100 67 106 67C112 67 114 70 114 77C111 75 107 74 104 74C100 74 97 76 96 77Z" fill="#C9913F"/>
  </g>

  <!-- Interactive Learning Tablet / Support Material -->
  <g transform="translate(74, 106)">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#FFFFFF" stroke="#0A192F" stroke-width="1.5"/>
    <!-- Accessible colored icons on tablet -->
    <rect x="4" y="4" width="9" height="12" rx="1.5" fill="#C9913F" fill-opacity="0.3"/>
    <circle cx="8.5" cy="10" r="2.5" fill="#C9913F"/>

    <rect x="16" y="4" width="10" height="5" rx="1" fill="#0056D2"/>
    <rect x="16" y="11" width="10" height="5" rx="1" fill="#10B981"/>
  </g>

  <!-- Certification Ribbon / Official AVS Check (Bottom Left) -->
  <g transform="translate(24, 110)">
    <circle cx="10" cy="10" r="7" fill="#C9913F"/>
    <path d="M7 10L9 12L13 8" stroke="#0A192F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
