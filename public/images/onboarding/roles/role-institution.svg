<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="org-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="org-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="144" height="144" rx="20" fill="url(#org-bg)"/>
  <rect x="8.5" y="8.5" width="143" height="143" rx="19.5" stroke="#E2E8F0"/>

  <!-- Building / Enterprise Emblem Badge (Top Right) -->
  <g transform="translate(108, 22)">
    <circle cx="16" cy="16" r="16" fill="#0A192F"/>
    <path d="M9 25V9L19 7V25" stroke="#C9913F" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M19 12L25 14V25" stroke="#DFAC56" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="14" cy="13" r="1" fill="#C9913F"/>
    <circle cx="14" cy="17" r="1" fill="#C9913F"/>
    <circle cx="14" cy="21" r="1" fill="#C9913F"/>
  </g>

  <!-- Ground Line -->
  <line x1="18" y1="128" x2="142" y2="128" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Classical Academic Academy Facade (Center) -->
  <g transform="translate(42, 38)">
    <!-- Pediment / Triangle Roof -->
    <path d="M38 6L4 22H72L38 6Z" fill="#0A192F"/>
    <path d="M38 10L14 21H62L38 10Z" fill="#C9913F"/>
    <!-- Flag on top -->
    <line x1="38" y1="6" x2="38" y2="-4" stroke="#0A192F" stroke-width="1.5"/>
    <polygon points="38,-4 46,-1 38,2" fill="#0056D2"/>

    <!-- Architrave -->
    <rect x="6" y="22" width="64" height="6" fill="#0A192F"/>
    <!-- Institutional Inscription Line -->
    <line x1="16" y1="25" x2="60" y2="25" stroke="#DFAC56" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Columns (4 Classical Pillars) -->
    <rect x="10" y="28" width="6" height="42" fill="#F8FAFC" stroke="#0A192F" stroke-width="1.2"/>
    <rect x="26" y="28" width="6" height="42" fill="#F8FAFC" stroke="#0A192F" stroke-width="1.2"/>
    <rect x="44" y="28" width="6" height="42" fill="#F8FAFC" stroke="#0A192F" stroke-width="1.2"/>
    <rect x="60" y="28" width="6" height="42" fill="#F8FAFC" stroke="#0A192F" stroke-width="1.2"/>

    <!-- Central Academy Portal / Arched Door -->
    <path d="M33 70V50C33 46 36 44 38 44C40 44 43 46 43 50V70H33Z" fill="#0A192F"/>
    <!-- Foundation Steps -->
    <rect x="2" y="70" width="72" height="4" fill="#0A192F"/>
    <rect x="0" y="74" width="76" height="4" fill="#64748B"/>
  </g>

  <!-- Collaborative Team Silhouettes (Foreground Left and Right) -->
  <!-- Member 1 (Left) -->
  <g transform="translate(22, 98)">
    <circle cx="8" cy="6" r="4" fill="#4F46E5"/>
    <path d="M2 28V20C2 16 5 13 8 13C11 13 14 16 14 20V28" fill="#4F46E5"/>
  </g>
  <!-- Member 2 (Center-Left) -->
  <g transform="translate(34, 104)">
    <circle cx="6" cy="4" r="3.5" fill="#0056D2"/>
    <path d="M1 22V16C1 13 3 10.5 6 10.5C9 10.5 11 13 11 16V22" fill="#0056D2"/>
  </g>
  <!-- Member 3 (Right) -->
  <g transform="translate(120, 98)">
    <circle cx="8" cy="6" r="4" fill="#4F46E5"/>
    <path d="M2 28V20C2 16 5 13 8 13C11 13 14 16 14 20V28" fill="#4F46E5"/>
  </g>
  <!-- Member 4 (Center-Right) -->
  <g transform="translate(110, 104)">
    <circle cx="6" cy="4" r="3.5" fill="#0056D2"/>
    <path d="M1 22V16C1 13 3 10.5 6 10.5C9 10.5 11 13 11 16V22" fill="#0056D2"/>
  </g>
</svg>
