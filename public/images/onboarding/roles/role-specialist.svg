<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="spec-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="spec-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="144" height="144" rx="20" fill="url(#spec-bg)"/>
  <rect x="8.5" y="8.5" width="143" height="143" rx="19.5" stroke="#E2E8F0"/>

  <!-- Stethoscope & Clinical Emblem Badge (Top Right) -->
  <g transform="translate(108, 22)">
    <circle cx="16" cy="16" r="16" fill="#0A192F"/>
    <path d="M10 8V14C10 17.3 12.7 20 16 20C19.3 20 22 17.3 22 14V8" stroke="#C9913F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M16 20V23C16 24 17 25 18 25H20" stroke="#C9913F" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="21" cy="25" r="2" fill="#DFAC56"/>
  </g>

  <!-- Desk Line -->
  <line x1="22" y1="126" x2="138" y2="126" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Specialist Figure (Center-Left) -->
  <g id="specialist-figure">
    <!-- Torso / Medical or Clinical Coat -->
    <path d="M42 126V108C42 99 48 93 56 91L62 90V83H72V90L78 91C86 93 92 99 92 108V126" fill="#0A192F"/>
    <!-- Clinical Coat Collar -->
    <path d="M62 90L67 106L72 90" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="67" y1="106" x2="67" y2="126" stroke="#C9913F" stroke-width="1.5"/>

    <!-- Head & Hair -->
    <circle cx="67" cy="65" r="13" fill="#0A192F"/>
    <path d="M54 64C54 53 60 49 68 49C76 49 80 53 80 64C76 61 71 60 67 60C61 60 57 62 54 64Z" fill="#9333EA"/>
  </g>

  <!-- Diagnostic Clipboard (Center) -->
  <g transform="translate(68, 96)">
    <!-- Board -->
    <rect x="0" y="4" width="22" height="30" rx="2" fill="#FFFFFF" stroke="#0A192F" stroke-width="1.5"/>
    <!-- Metal Clip -->
    <rect x="6" y="1" width="10" height="5" rx="1" fill="#C9913F"/>
    <!-- Evaluation Checklists / Sound Waves -->
    <line x1="4" y1="11" x2="18" y2="11" stroke="#9333EA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="14" y2="16" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="21" x2="17" y2="21" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="16" cy="26" r="2" fill="#10B981"/>
  </g>

  <!-- Developmental Cognitive Cubes / Speech Therapy Aids (Right) -->
  <g transform="translate(104, 102)">
    <!-- Base Cube 1 -->
    <rect x="0" y="12" width="12" height="12" rx="1.5" fill="#0056D2" stroke="#0A192F" stroke-width="1"/>
    <!-- Base Cube 2 -->
    <rect x="14" y="12" width="12" height="12" rx="1.5" fill="#C9913F" stroke="#0A192F" stroke-width="1"/>
    <!-- Top Cube 3 -->
    <rect x="7" y="0" width="12" height="12" rx="1.5" fill="#9333EA" stroke="#0A192F" stroke-width="1"/>
    <text x="13" y="9" font-size="7" font-family="sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>
</svg>
