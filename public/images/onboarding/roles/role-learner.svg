<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="learner-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="learner-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFAC56"/>
      <stop offset="100%" stop-color="#C9913F"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="144" height="144" rx="20" fill="url(#learner-bg)"/>
  <rect x="8.5" y="8.5" width="143" height="143" rx="19.5" stroke="#E2E8F0"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="80" cy="80" r="52" fill="#0056D2" fill-opacity="0.04"/>

  <!-- Academic Mortarboard Floating Badge (Top Right) -->
  <g transform="translate(108, 22)">
    <circle cx="16" cy="16" r="16" fill="#0A192F"/>
    <path d="M16 8L7 13L16 18L25 13L16 8Z" fill="#C9913F"/>
    <path d="M10 15V20C10 22 13 23.5 16 23.5C19 23.5 22 22 22 20V15" stroke="#C9913F" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M23 14V19" stroke="#DFAC56" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="23" cy="20" r="1" fill="#DFAC56"/>
  </g>

  <!-- Study Desk Line -->
  <line x1="22" y1="126" x2="138" y2="126" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Adult Learner Figure -->
  <g id="figure">
    <!-- Torso / Professional Blazer -->
    <path d="M42 126V114C42 105 48 97 58 95L68 93V86H80V93L90 95C100 97 106 105 106 114V126" fill="#0A192F"/>
    <!-- Collar / Shirt Detail -->
    <path d="M68 93L74 104L80 93" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="74" y1="104" x2="74" y2="120" stroke="#0056D2" stroke-width="1.5"/>

    <!-- Neck & Head -->
    <rect x="70" y="78" width="8" height="10" rx="2" fill="#E2E8F0"/>
    <circle cx="74" cy="68" r="14" fill="#0A192F"/>
    <!-- Sleek Professional Hair & Glasses -->
    <path d="M60 67C60 56 66 52 74 52C82 52 88 56 88 67C84 64 78 63 74 63C68 63 64 65 60 67Z" fill="#0056D2"/>
    <circle cx="70" cy="68" r="3.2" stroke="#C9913F" stroke-width="1.2" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="78" cy="68" r="3.2" stroke="#C9913F" stroke-width="1.2" fill="#FFFFFF" fill-opacity="0.8"/>
    <line x1="73.2" y1="68" x2="74.8" y2="68" stroke="#C9913F" stroke-width="1.2"/>
  </g>

  <!-- Open Laptop on Desk -->
  <g transform="translate(62, 102)">
    <!-- Screen -->
    <rect x="0" y="0" width="34" height="22" rx="2" fill="#0056D2"/>
    <rect x="2" y="2" width="30" height="18" rx="1.5" fill="#FFFFFF"/>
    <!-- Code / Lesson Content Lines on Screen -->
    <line x1="6" y1="6" x2="20" y2="6" stroke="#0056D2" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="10" x2="26" y2="10" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="22" y2="14" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Gold Certification Check on screen -->
    <circle cx="23" cy="6" r="2.5" fill="#C9913F"/>
    <!-- Base / Keyboard -->
    <path d="M-6 22H40L37 25H-3L-6 22Z" fill="#0A192F"/>
    <rect x="14" y="23.5" width="6" height="1" rx="0.5" fill="#94A3B8"/>
  </g>

  <!-- Certification Scroll / Diploma on Desk (Left) -->
  <g transform="translate(26, 106)">
    <rect x="0" y="4" width="22" height="15" rx="1.5" fill="#FFFFFF" stroke="#C9913F" stroke-width="1.2"/>
    <line x1="3" y1="8" x2="15" y2="8" stroke="#0A192F" stroke-width="1"/>
    <line x1="3" y1="11" x2="19" y2="11" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="3" y1="14" x2="13" y2="14" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- Red/Gold Seal -->
    <circle cx="17" cy="14" r="2.5" fill="url(#learner-gold)"/>
    <path d="M16 16.5L15 19L17 18L19 19L18 16.5" fill="#C9913F"/>
  </g>

  <!-- Coffee Mug / Focus Indicator (Right) -->
  <g transform="translate(112, 112)">
    <rect x="0" y="0" width="10" height="13" rx="1.5" fill="#FFFFFF" stroke="#0A192F" stroke-width="1.2"/>
    <path d="M10 2.5C12 2.5 13 4 13 6.5C13 9 12 10.5 10 10.5" stroke="#0A192F" stroke-width="1.2"/>
    <!-- Steam -->
    <path d="M3 -3C2.5 -5 4.5 -6 4 -8" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>
    <path d="M7 -2C6.5 -4 8.5 -5 8 -7" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
