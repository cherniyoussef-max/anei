# Development-only infrastructure. Production should use managed/private services.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: anei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anei}
      POSTGRES_USER: ${POSTGRES_USER:-anei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anei}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anei_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anei} -d ${POSTGRES_DB:-anei}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: anei-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - anei_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: anei-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local S3-compatible object storage for private course/resource uploads
  # (PDFs, images, video). Production should use a managed provider (S3, R2,
  # Backblaze B2) — see STORAGE_* env vars.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: anei-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - anei_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket, then exits. Browser-upload CORS is set
  # server-wide via MINIO_API_CORS_ALLOW_ORIGIN above (bucket-level CORS is
  # not available on this MinIO build).
  minio-init:
    # Immutable digest inspected from the 2025-08-06 client build.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: anei-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set} ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set} &&
      mc mb -p local/${STORAGE_BUCKET:-anei-storage} &&
      mc anonymous set none local/${STORAGE_BUCKET:-anei-storage}
      "

  # Phase 10E: self-hosted n8n automation. Runs in its OWN network with its OWN
  # Postgres database — it never touches the ANEI database, and the ANEI
  # database never reaches into the n8n container. The editor is bound to
  # localhost only. See docs/premium/N8N_SETUP.md for provisioning.
  # WARNING: never run `docker compose down -v` on this file — it would destroy
  # the ANEI and n8n volumes.
  n8n-postgres:
    image: postgres:17-alpine
    container_name: anei-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n-local-only}
    volumes:
      - anei_n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - n8n_internal

  n8n:
    image: n8nio/n8n:2.36.0
    container_name: anei-n8n
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set to a long random string}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Africa/Tunis
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n-local-only}
      # ANEI automation bridge (Phase 10E) — see docs/premium/N8N_SETUP.md.
      # n8n -> ANEI internal API auth; distinct from ANEI_N8N_DISPATCH_TOKEN
      # (ANEI -> n8n webhook dispatch), never the same value.
      ANEI_INTERNAL_BASE_URL: ${ANEI_INTERNAL_BASE_URL:-http://host.docker.internal:3000}
      N8N_ANEI_SERVICE_TOKEN: ${N8N_ANEI_SERVICE_TOKEN:?N8N_ANEI_SERVICE_TOKEN must be set to a long random string, distinct from ANEI_N8N_DISPATCH_TOKEN}
      # Message template UUIDs — set once real WhatsApp templates exist
      # (Meta Cloud API must be connected first, see /admin/system).
      APPOINTMENT_REMINDER_TEMPLATE_ID: ${APPOINTMENT_REMINDER_TEMPLATE_ID:-}
      ONBOARDING_FOLLOWUP_TEMPLATE_ID: ${ONBOARDING_FOLLOWUP_TEMPLATE_ID:-}
      TEACHER_NOTIFICATION_TEMPLATE_ID: ${TEACHER_NOTIFICATION_TEMPLATE_ID:-}
      # Hardening: no community nodes, and the executor is locked down to the
      # nodes the allowlisted workflows actually use (webhook trigger, HTTP
      # Request, Set, IF, Wait, Code). Command/binary/network-shell nodes are
      # never available.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.executeWorkflow","n8n-nodes-base.readBinaryFiles","n8n-nodes-base.readWriteFile","n8n-nodes-base.sftp","n8n-nodes-base.ssh","n8n-nodes-base.ftp","n8n-nodes-base.imap","n8n-nodes-base.pop3","n8n-nodes-base.mailgun","n8n-nodes-base.s3"]'
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      n8n-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - anei_n8n_data:/home/node/.n8n
    networks:
      - n8n_internal

volumes:
  anei_postgres_data:
  anei_redis_data:
  anei_minio_data:
  anei_n8n_postgres_data:
  anei_n8n_data:

networks:
  n8n_internal:
    driver: bridge
